name: render

on:
  workflow_dispatch:
    inputs:
      settings:
        description: "Налаштування зі студії (JSON)"
        required: false
        default: "{}"
      reel:
        description: "Id рілса (motionclone або tgNN)"
        required: false
        default: "motionclone"

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prepare props
        env:
          SETTINGS: ${{ inputs.settings }}
          REEL: ${{ inputs.reel }}
        run: |
          node -e '
            const fs = require("fs");
            const settings = JSON.parse(process.env.SETTINGS || "{}");
            const id = (process.env.REEL || "motionclone").replace(/[^\w-]/g, "");
            if (id === "motionclone") {
              fs.writeFileSync("props.json", JSON.stringify({ settings }));
              fs.writeFileSync("comp.txt", "Reel");
            } else {
              fs.mkdirSync("public/reelvoice", { recursive: true });
              for (const f of fs.readdirSync(`reels/${id}/voice`)) fs.copyFileSync(`reels/${id}/voice/${f}`, `public/reelvoice/${f}`);
              const script = JSON.parse(fs.readFileSync(`reels/${id}/script.json`, "utf8"));
              const timings = JSON.parse(fs.readFileSync(`reels/${id}/timings.json`, "utf8"));
              fs.writeFileSync("props.json", JSON.stringify({ script, timings, voiceBase: "static:reelvoice/", settings }));
              fs.writeFileSync("comp.txt", "AutoReel");
              fs.writeFileSync("title.txt", script.title || id);
            }
          '

      - name: Render video
        run: npx remotion render src/index.jsx "$(cat comp.txt)" out/reel.mp4 --props=props.json --concurrency=2

      - name: Publish as release
        env:
          GH_TOKEN: ${{ github.token }}
          REEL: ${{ inputs.reel }}
        run: |
          T="$( [ -f title.txt ] && cat title.txt || echo MotionClone )"
          NAME="$T · $(TZ=Europe/Warsaw date '+%d.%m %H:%M')"
          gh release create "render-${{ github.run_number }}" out/reel.mp4 --title "$NAME" --notes "Рілс: $REEL. Змонтовано зі студії." --latest=false
