name: render

on:
  workflow_dispatch:
    inputs:
      settings:
        description: "Налаштування зі студії (JSON)"
        required: false
        default: "{}"

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prepare settings
        env:
          SETTINGS: ${{ inputs.settings }}
        run: |
          node -e 'const s=JSON.parse(process.env.SETTINGS||"{}"); require("fs").writeFileSync("props.json", JSON.stringify({settings:s}))'
          cat props.json

      - name: Render video
        run: npx remotion render src/index.jsx Reel out/reel.mp4 --props=props.json --concurrency=2

      - name: Publish as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="Рілс $(TZ=Europe/Warsaw date '+%d.%m %H:%M')"
          gh release create "render-${{ github.run_number }}" out/reel.mp4 --title "$NAME" --notes "Змонтовано зі студії. Налаштування: $(cat props.json)" --latest=false
