name: posts

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python tools/fetch_posts.py
      - name: Commit
        run: |
          git add posts.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -m "Update posts"
          git pull --rebase && git push
